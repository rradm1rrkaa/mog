<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#147d59">
  <title>BurmalBank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">BB</span>
        <span><strong>BurmalBank</strong><small data-i18n="accounting">BurmalBank</small></span>
      </div>
      <nav class="main-nav" aria-label="Основная навигация">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span><span data-i18n="dashboard">Обзор</span></button>
        <button class="nav-item" data-view="workers"><span>♙</span><span data-i18n="workers">Работники</span></button>
        <button class="nav-item" data-view="distribution"><span>↗</span><span data-i18n="distribution">Распределение</span></button>
        <button class="nav-item" data-view="history"><span>◷</span><span data-i18n="history">История</span></button>
        <button class="nav-item" data-view="analytics"><span>▥</span><span data-i18n="analytics">Аналитика</span></button>
        <button class="nav-item" data-view="settings"><span>⚙</span><span data-i18n="settings">Настройки</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="secure-dot"></div>
        <span data-i18n="localData">Данные хранятся локально</span>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="Меню">☰</button>
        <div class="crumb" id="pageCrumb">Обзор</div>
        <div class="top-actions">
          <span class="live-status"><i></i><span data-i18n="online">Локальный режим</span></span>
          <select id="headerLanguage" aria-label="Язык">
            <option value="ru">RU</option>
            <option value="kk">KZ</option>
            <option value="en">EN</option>
          </select>
          <div class="avatar">AK</div>
        </div>
      </header>
      <div id="toast" class="toast" role="status"></div>
      <div class="page-wrap" id="app"></div>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
